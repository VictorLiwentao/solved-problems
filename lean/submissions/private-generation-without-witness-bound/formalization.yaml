version: v0.4
project:
  name: Private generation without a public witness bound
  description: A finite nonempty family of infinite languages admits pure-private generation with
    exponentially decreasing error on every admissible law exactly when the languages have infinite
    common intersection.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
