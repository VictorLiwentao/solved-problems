  location: https://arxiv.org/abs/2604.07238v2
  relationship: background
  note: Xiaoyu Li, Andi Han, Jiaojiao Jiang and Junbin Gao (Appendix H.1, question 1)
status:
  scope: The finite-family theorem in both directions, with replace-one privacy, arbitrary countably
    supported input laws, and exponential rates whose constants may depend on the input law.
  sorry_count: 0
  sorry_in_definitions: 0
