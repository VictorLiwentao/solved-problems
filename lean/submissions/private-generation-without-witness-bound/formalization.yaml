  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: Words are natural numbers. Normalized point masses represent discrete distributions
    and repeated expectations represent IID samples. The privacy parameter is its finite multiplier
    k = exp(ε), with k > 1. The separate characterization for countably infinite collections is outside
    this theorem.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Finite-family theorem
    lean: PrivateWitness.finiteFamily
    module: SolvedProblems.PrivateWitness
    status: proved
    note: An infinite intersection gives a data-independent sampler. The converse derives a change-of-law
      bound from replace-one privacy and proves necessity on the given finite collection.
