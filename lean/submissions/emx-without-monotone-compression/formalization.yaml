alignment:
  statements:
  - source: The EMX versus compression theorem
    lean: EMX.separation
    module: SolvedProblems.EMX
    status: proved
    note: The countable class is properly learnable and has no fixed compression bound even with a
      fixed finite side alphabet.
  - source: Optimal size as the sample grows
    lean: EMX.logarithmicSize
    module: SolvedProblems.EMX
    status: proved
    note: The explicit upper and lower bounds on the least compression size give leading coefficient
      one in base-two logarithms.
