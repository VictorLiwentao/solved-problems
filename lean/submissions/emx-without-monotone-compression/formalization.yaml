version: v0.4
project:
  name: EMX learnability without bounded monotone compression
  description: One deterministic proper learner works for every accuracy, confidence and IID law on
    an explicit countable family of finite sets. Every bounded monotone decoder fails even with a
    fixed finite alphabet of auxiliary messages and ordered, repeated sample entries. The optimal
    size for samples up to m is log₂ m up to an additive term of order log log m.
  authors:
  - Wentao Li
  responsible_maintainers:
