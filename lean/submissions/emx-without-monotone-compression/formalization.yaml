fidelity:
  divergences: The learner outputs a hypothesis from the given class and its failure probability is
    computed under the finite IID product measure. The proof of uniform convergence uses direct concentration
    and summation. A different decoder at each common sample length cannot restore a constant compression
    bound. The least valid compression size d for samples of length at most m obeys d ≤ floor(log₂
    m) ≤ d + 2(floor(log₂ floor(log₂ m))+1) for m ≥ 2.
