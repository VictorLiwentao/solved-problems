    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: The word tracks positions by value and encodes immediate successors. A deterministic
    machine scans its input from right to left. BoundedJump.machine and BoundedJump.stateBound are
    executable Lean definitions. BoundedJump.machine_enumerates verifies this implementation.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Theorem, including the monadic second-order construction and finite-state counting
    lean: BoundedJump.finiteEnumeration
    module: SolvedProblems.BoundedJump
    status: proved
    note: One compiler works uniformly in the jump bound and the finite list of forbidden patterns.
      Accepted words correspond bijectively to the permutations. The counting result covers rationality,
      operation counts and bit bounds.
