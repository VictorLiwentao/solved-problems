version: v0.4
project:
  name: A finite automaton for bounded jumps and arbitrary forbidden permutation patterns
  description: For every fixed jump bound and finite list of forbidden permutation patterns, the construction
    recognizes successor words in bijection with the avoiding permutations. Finite-state counting
    gives a rational generating function.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
