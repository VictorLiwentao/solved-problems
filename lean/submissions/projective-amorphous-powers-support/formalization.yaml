    lean: ProjectiveSupports.finite_image
    module: SolvedProblems.ProjectivePowerModel
    status: proved
    note: Every supported map on finite tuples to a fixed-label codomain has finite range.
  - source: First-order translation in the permutation interpretation
    lean: ProjectiveSupports.powerStructureProperties
    module: SolvedProblems.ProjectivePowerModel
    status: proved
    note: Finite type spectra and minimality of the graph structure follow from the internally amorphous
      hypothesis.
