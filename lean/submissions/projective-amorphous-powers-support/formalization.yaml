fidelity:
  divergences: Internal powersets consist of subsets of the externally infinite atom type fixed by
    a pointwise stabilizer of a finite set. The finite-image statement uses a trivial action on the
    codomain. The quantified graph comes from a supported self-map on tuples of these internal subsets.
