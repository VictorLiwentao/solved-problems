version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: Internal amorphousness in a finite-point-support permutation interpretation gives finite
    images for supported finite-arity maps to fixed labels. For the actual supported power-set map
    the associated first-order graph has finite realized type spectra and minimal unary definable
    sets. The construction also has [Ramsey extraction](SolvedProblems/ProjectiveExtraction.lean),
    [permutation invariance](SolvedProblems/ProjectiveIndiscernibles.lean), [local homogeneity](SolvedProblems/ProjectiveHomogeneity.lean)
    and [block-model transfer](SolvedProblems/ProjectiveBlockTransfer.lean).
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
