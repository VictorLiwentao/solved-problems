    is pending.
alignment:
  statements:
  - source: Main support inclusion theorem
    lean: ChainWords.support_forces_language
    module: SolvedProblems.ChainWordsReconstruction
    status: proved
    note: The inclusion of fundamental supports imposes the stated containment of chain words.
  - source: Comparison of maximum chain heights
    lean: ChainWords.height_antitone
    module: SolvedProblems.ChainWordsReconstruction
    status: proved
    note: The same hypothesis gives the inequality for maximum chain heights.
  - source: Original equal-enumerators conclusion
    lean: ChainWords.equal_enumerators_height
    module: SolvedProblems.ChainWordsReconstruction
    status: proved
    note: Matching all P-partition monomial coefficients determines the relevant chain heights.
  - source: Chain interpretation
    lean: ChainWords.saturated_iff
    module: SolvedProblems.ChainWordsReconstruction
    status: proved
    note: The formal word language is characterized using actual saturated chains.
  - source: P-partition expansion
    lean: ChainWords.fundamental_expansion
    module: SolvedProblems.ChainWordsReconstruction
    status: proved
    note: The monomial counts equal the fundamental expansion over true linear extensions.
