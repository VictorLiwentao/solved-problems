fidelity:
  divergences: The support uses actual linear extensions and their descent sets. P-partition monomial
    coefficients count functions on vertices satisfying the cover inequalities with each prescribed
    multiplicity. The proof establishes the fundamental-basis expansion by standardization and recovers
    exact descent counts.
review:
