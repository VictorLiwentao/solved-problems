version: v0.4
project:
  name: Reading longest chains from fundamental support
  description: If the fundamental descent support of one finite labeled poset is contained in that
    of another, the second poset’s saturated-chain word language is contained in the first’s, and
    its maximum chain height is no larger. Equality of P-partition enumerators implies equality of
    heights.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
