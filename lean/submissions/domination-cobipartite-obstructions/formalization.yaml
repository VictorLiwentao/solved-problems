  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Shattering forces an induced co-bipartite subgraph
    lean: DominationVC.shattering
    module: SolvedProblems.DominationVC
    status: proved
    note: A sufficiently large shattered set in an incomparability graph yields the specified induced
      embedding.
  - source: VC dimension upper bound
    lean: DominationVC.vc_bound
    module: SolvedProblems.DominationVC
    status: proved
    note: The induced-subgraph exclusion bounds the VC dimension of the actual closed-neighborhood
      family.
  - source: Matching-order lower example
    lean: DominationVC.vc_lower
    module: SolvedProblems.DominationVC
    status: proved
    note: An explicit height-two host avoids two disjoint cliques and has the claimed lower bound
      on its VC dimension.
  - source: Reduction to hypergraph transversals
    lean: DominationVC.domination_reduction
    module: SolvedProblems.DominationVC
    status: proved
    note: The cleaned hypergraph has at most n edges and the stated VC bound; its minimal transversals
      coincide with minimal dominating sets.
