version: v0.4
project:
  name: Minimal domination in hereditary classes of incomparability graphs
  description: For a finite poset, excluding a specified induced co-bipartite graph bounds the VC
    dimension of its closed incomparability neighborhoods. Explicit examples give a matching-order
    lower bound. Minimal dominating sets are exactly the minimal transversals of a hypergraph with
    at most one edge per vertex satisfying this bound.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
