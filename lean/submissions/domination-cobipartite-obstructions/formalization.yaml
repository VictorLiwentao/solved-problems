fidelity:
  divergences: For a forbidden pattern with clique sides of sizes a and b and arbitrary specified
    cross edges, the strict upper bound is 2(2a + 2 max(1, ceil(log₂(b²)))). For 1 ≤ a ≤ b, an induced-(Kₐ
    ⊔ Kᵦ)-free membership poset gives VC dimension at least max(a−1, floor(log₂(b+1))−2) in natural-number
    arithmetic. The hypergraph uses inclusion-minimal closed neighborhoods.
review:
