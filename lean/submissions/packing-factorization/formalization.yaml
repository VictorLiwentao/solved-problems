version: v0.4
project:
  name: Exactly when variable-overlap permutation packings factor
  description: For a pattern, an allowed alphabet of overlaps and a designated seam, a finite test
    decides whether every packing count factors across the seam. A failed test yields overlap words
    witnessing strict inequality.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
