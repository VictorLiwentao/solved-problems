automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: A packing is an ordering of the distinct physical slots preserving all within-window
    comparisons. A shared slot keeps its label when the next window is attached. The proof uses cuts
    and a finite graph of compatible rank profiles to determine which anchor gaps can contain an exclusive
    position. The Lean decision procedure enumerates bounded overlap words and compatible cuts. The
    draft’s Python implementation searches the graph of cuts.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Main theorem, factorization at the shared chain
    lean: PackingFactorization.factorization_criterion
    module: SolvedProblems.Factorization
    status: proved
    note: The disjointness of the two sets of occupiable gaps is equivalent to multiplicativity of
      the physical packing counts at every seam.
  - source: Main theorem, shortest witness bound
    lean: PackingFactorization.short_counterexample
    module: SolvedProblems.Factorization
    status: proved
    note: Whenever multiplicativity fails, two overlap words of lengths at most K+1 witness a strict
      count inequality at the seam.
  - source: Executable finite decision procedure
    lean: PackingFactorization.factorTest_correct
    module: SolvedProblems.Factorization
    status: proved
    note: The Boolean test enumerates bounded overlap words and compatible cuts. It returns true exactly
      when every packing count factors across the seam.
