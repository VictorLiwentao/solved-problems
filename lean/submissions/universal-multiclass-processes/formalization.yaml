version: v0.4
project:
  name: A process criterion for universal multiclass online learning
  description: For every diverging nondecreasing mistake budget there is a closed class on a deterministic
    process that meets the budget on all realizable streams. Every randomized learner has a fixed
    stream on which regret tends to one almost surely.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
