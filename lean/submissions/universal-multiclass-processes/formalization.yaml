  location: https://proceedings.mlr.press/v306/hanneke26b.html
  relationship: background
  note: Steve Hanneke and Hongao Wang (Appendix D.1, Q1)
status:
  scope: The realizable versus agnostic separation proposition, with a single comparator of asymptotically
    zero loss and the matching upper bound of one on regret.
