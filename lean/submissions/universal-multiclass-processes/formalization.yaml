automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: Time is the input and labels are natural numbers. A finite payload word has one encoded
    header. The construction allows countably many payload labels and chooses labels with summably
    small prediction probabilities along a fixed stream. The proof applies the first Borel–Cantelli
    lemma. The general process minimax characterization is a separate theorem.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Proposition on the separation of realizable and agnostic learning
    lean: ProcessSeparation.separation
    module: SolvedProblems.ProcessSeparation
    status: proved
    note: The target and predictor satisfy the arbitrary mistake budget. Each randomized strategy
      has a fixed bad stream, and regret against a single vanishing-loss comparator tends to one almost
      surely.
  - source: Universal upper bound for the separation proposition
    lean: ProcessSeparation.regret_upper
    module: SolvedProblems.ProcessSeparation
    status: proved
    note: For every predictor, comparator, response stream and finite horizon the excess of the two
      mistake fractions is at most one.
