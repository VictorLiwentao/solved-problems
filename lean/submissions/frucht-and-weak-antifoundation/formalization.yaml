    lean: WeakFrucht.expansion_iso_extensional
    module: SolvedProblems.WeakFrucht
    status: proved
    note: Distinct labels force isomorphism-extensionality of the constructed expansion.
  - source: Reusable labels suffice for representation
    lean: WeakFrucht.reusable_labels_suffice
    module: SolvedProblems.WeakFrucht
    status: proved
    note: Every accessible extensional pointed relation has an accessible extensional and isomorphism-extensional
