fidelity:
  divergences: The construction works on actual directed edge relations and pointed accessibility,
    permits shared successors, and takes propositional excluded middle explicitly. Its axiom report
    contains propext and Quot.sound. The premise supplies a coded family of inequivalent pointed graph
    labels for each represented index type.
