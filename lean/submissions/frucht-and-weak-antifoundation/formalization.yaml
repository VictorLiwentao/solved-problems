version: v0.4
project:
  name: Frucht's theorem and weak forms of anti-foundation
  description: A uniform supply of distinct graph labels yields an accessible, extensional and isomorphism-extensional
    representation and decoration of every accessible extensional pointed digraph. The proof restores
    the well-founded part by accessibility induction.
