fidelity:
  divergences: Algebraic closure is defined by finite first-order definable sets. The proof assumes
    finitely many realized types at each finite arity and the finite/cofinite property for unary definable
    sets with parameters. Local finite-set symmetries fix the base, move the specified non-base point,
    preserve closure on every subset and extend on larger finite closed sets.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Strong minimality and homogeneous closure
    lean: ProjectiveAlgebraic.pregeometry
    module: SolvedProblems.ProjectiveHomogeneity
    status: proved
    note: Actual first-order algebraic closure is a locally finite pregeometry under the stated finite
      spectra and minimality hypotheses.
  - source: Local homogeneity in Truss’s definition
    lean: ProjectiveAlgebraic.localHomogeneity
    module: SolvedProblems.ProjectiveHomogeneity
    status: proved
    note: The automorphism on a finite closed set fixes the smaller closed base, sends a given point
      to another and extends coherently to each larger finite closed set.
