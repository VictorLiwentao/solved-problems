version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: Finite tuple-type spectra and finite/cofinite unary definable sets give a locally finite
    algebraic-closure pregeometry. Its finite closed sets have the homogeneity and extension properties
    used in the manuscript. A separate block-model comparison proves transfer of the coded self-map
    and the uniform bound on its orbits. [Block-model proof](SolvedProblems/ProjectiveBlockTransfer.lean)
