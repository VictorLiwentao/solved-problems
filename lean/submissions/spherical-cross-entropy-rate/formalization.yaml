version: v0.4
project:
  name: The best finite-class rate for spherical cross-entropy
  description: Every equal-weight spherical polynomial design satisfies an explicit factorial upper
    bound for its exponential pair energy and tied cross-entropy. The optimal intrinsic-dimension
    upper rate follows from the cited exact-cardinality design existence theorem.
