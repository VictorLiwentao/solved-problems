    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: The ambient space is real Euclidean space of dimension s+1, and the measure on the
    actual unit sphere is normalized Haar surface measure. Rotation invariance and the constant partition
    function are proved. A design integrates the restriction of every multivariate polynomial through
    degree t. The empirical loss is the mean of log-normalized exponential kernel averages, and the
    pair gap is the normalized empirical double kernel sum minus one.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Factorial bound on spherical designs
    lean: SphericalEntropy.design_gaps
    module: SolvedProblems.SphericalEntropyUpper
    status: proved
    note: For every equal-weight spherical t-design the tied loss is at most the pair energy, whose
      absolute value is at most twice exp(α) α^(t+1)/((t+1)! a).
  - source: Intrinsic-dimension upper rate from design existence
    lean: SphericalEntropy.upper_rate
    module: SolvedProblems.SphericalEntropyUpper
    status: proved
    note: Assuming the cited exact-size design theorem, for all sufficiently large class counts there
      exist configurations with pair energy and tied loss at most exp(−c N^(1/s) log N), for a positive
      c.
