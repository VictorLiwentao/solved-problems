version: v0.4
project:
  name: Which languages can a private learner identify in the limit?
  description: When s languages share an infinite subset, the optimal worst-case success probability
    for private identification with k slots is k/s. With unrestricted repetitions, a single shared
    word suffices. A private learner attains the bound.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
