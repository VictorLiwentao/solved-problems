    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel Codex agents developed and checked the Lean proofs using the pinned Lean
      4 and Mathlib release.
    prompting_notes: The repository owner requested another five draft proofs verified end to end.
  notes: The individual draft credits AI assistance in preparing the mathematical text. Spend and
    wall time were not tracked.
fidelity:
  divergences: Finite subsets of the ordinary points are encoded by binary masks. The real-valued
    preference preserves the ordering used in the paper. Countable discrete laws are represented by
    nonnegative atom masses with total mass one. Growing finite cubes exhaust the full IID sample
    space.
review:
  status: self-assessed
  notes: The project checked the formal statements against the cited draft. Independent human mathematical
    and priority review is pending.
alignment:
  statements:
  - source: Theorem, Construction, and PAC guarantee
    lean: SelectedDisagreement.selectedSeparation
    module: SolvedProblems.SelectedDisagreement
    status: proved
    note: The common target is the central hypothesis. Every binary labeling of the first n ordinary
      points is realized as its disagreement with a hypothesis selected on a realizable sample.
  - source: Theorem, distribution-free bound
    lean: SelectedDisagreement.pacProbability
    module: SolvedProblems.SelectedProbability
    status: proved
    note: The probability of true error above ε on m independent samples is at most 2(1−ε)^m + m(1−ε)^(m−1).
      The confidence threshold is uniform in the law and the target.
