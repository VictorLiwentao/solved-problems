version: v0.4
project:
  name: A successful regularizer with infinite selected disagreement dimension
  description: A fixed injective preference selects a unique consistent hypothesis on every realizable
    sample. Its actually selected disagreements shatter sets of every finite size, yet the selector
    has a distribution-free PAC sample bound.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
