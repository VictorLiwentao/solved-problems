  id: Li2026-selected-disagreement-dimension
  location: https://github.com/VictorLiwentao/solved-problems/tree/953500a98776892039ef599c32ff492c16b93451/results/learning-theory/selected-disagreement-dimension
  relationship: formalizes
- title: 'Algorithmic Principles For Multiclass Learning Are Hard To Come By: Limits of Regularization
