version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: In any omega-standard pure membership model of the stated ZF fragment, every internal
    map from an internally amorphous set to an internally linearly ordered set has an internally finite
    image. The proof uses a first-order test for parity of finite initial segments and establishes
    that internal finiteness is absolute for these models. The [permutation-model classification](SolvedProblems/ProjectivePermutation.lean)
    and [material coordinate theorem](SolvedProblems/ProjectiveZFCoordinate.lean) cover the other
    interpretations specified there.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
