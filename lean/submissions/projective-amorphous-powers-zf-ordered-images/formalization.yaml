fidelity:
  divergences: The structure has only a binary membership relation. The pure model assumptions are
    Extensionality, Pairing, Union, Power Set and first-order Separation. There is no internal enumeration
    of the amorphous set. Parity of a finite initial segment is defined by the existence of an internal
    partition into equinumerous halves. Both the external and internal finite-image formulations have
    checked proofs.
