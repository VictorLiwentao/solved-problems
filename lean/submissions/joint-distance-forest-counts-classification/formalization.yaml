    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Labels pair shortest-path distance with resistance computed from the inverse grounded
    unit-conductance Laplacian. The theorem compares every refinement round and the witness theorem
    provides two finite connected hosts of diameter exactly two for each cyclic finite simple pattern.
    The unbounded family clause permits patterns of every finite size.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Main theorem, forest characterization
    lean: JointForest.classification
    module: SolvedProblems.JointForestClassification
    status: proved
    note: Both directions for every finite simple pattern under comparisons of all finite connected
      hosts.
  - source: Separating cyclic patterns
    lean: JointForest.cyclic_witness
    module: SolvedProblems.JointForestClassification
    status: proved
    note: Two explicit connected diameter-two hosts have identical joint refinement labels at every
      round and strictly different homomorphism counts.
  - source: No characterization by any homomorphism-count family
    lean: JointForest.no_hom_family
    module: SolvedProblems.JointForestClassification
    status: proved
    note: Any candidate family selecting patterns of arbitrary finite size fails on connected hosts.
  - source: Lift counts
    lean: JointForest.sheet_count
    module: SolvedProblems.JointForestClassification
    status: proved
    note: Counts the consistent assignments of sheets to the lift.
  - source: Strict count obstruction in cones
    lean: JointForest.cone_twist_loss
    module: SolvedProblems.JointForestClassification
    status: proved
    note: An inconsistent twist removes homomorphisms into the lifted cone.
  - source: Metric calculation
    lean: JointForest.opposite_sheets_dist
    module: SolvedProblems.JointForestClassification
    status: proved
    note: Distance data between the two opposite sheets are computed for the constructed hosts.
