version: v0.4
project:
  name: What shortest paths and resistance can count together
  description: For every finite simple pattern F, its homomorphism count is invariant under joint
    shortest-path and effective-resistance refinement on all finite connected hosts exactly when F
    is a forest. Each cyclic F has connected diameter-two witnesses with equal labels at every round
    and unequal counts. No family of ordinary homomorphism counts characterizes this refinement. [Forest
    direction and fixed hosts](SolvedProblems/JointForest.lean)
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
