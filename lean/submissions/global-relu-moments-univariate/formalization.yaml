version: v0.4
project:
  name: Finite Gaussian moments determine an entire ReLU function
  description: For real inputs, finitely many ordinary moments under the standard Gaussian or the
    normalized Laplace law identify ReLU network functions pointwise. For a fixed P-parameter architecture,
    2P+1 generic polynomial measurements suffice. The [general linear-compression theorem](SolvedProblems/ReluMoments.lean)
    holds in arbitrary input dimension for a supplied finite moment list.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
