fidelity:
  divergences: The targets use Mathlib’s gaussianReal 0 1 and the density exp(−|x|)/2. Networks can
    share gate outputs and have arbitrary parameters including degeneracies. Equality is at every
    real input. The published h-dependent bounds are specialized to dimension one; the new proof uses
    sign changes of piecewise-affine functions.
