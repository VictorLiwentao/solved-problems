    lean: ReluMoments.univariate_laws
    module: SolvedProblems.ReluUnivariateLaws
    status: proved
    note: The bounded moment lists distinguish precisely the different realized one-dimensional functions.
  - source: Generic polynomial measurement compression in d=1
    lean: ReluMoments.univariate_compressed_laws
    module: SolvedProblems.ReluUnivariateLaws
    status: proved
    note: For each law, generic fixed polynomial measurements retain pointwise identification at the
      stated size.
