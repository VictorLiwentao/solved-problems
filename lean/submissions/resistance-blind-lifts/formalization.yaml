version: v0.4
project:
  name: Resistance-distance graph transformers can miss bipartiteness
  description: Two connected simple graphs on 78 vertices have equal resistance-refinement colors
    at every depth for every common labeling of their fibers. Two rounds of shortest-path refinement
    distinguish them. Their ordinary Laplacian characteristic polynomials differ, and exactly one
    graph is bipartite.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
