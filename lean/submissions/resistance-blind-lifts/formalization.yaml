    lean: ResistanceLifts.separation
    module: SolvedProblems.ResistanceLifts
    status: proved
    note: Paired resistance profiles agree under all fiber labelings and at every depth while distance
      histograms at depth two and Laplacian characteristic polynomials distinguish the witnesses.
