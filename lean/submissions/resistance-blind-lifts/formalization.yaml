    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Resistance is the voltage difference for a unit source and sink in the real unit-conductance
    graph Laplacian. Explicit Green columns solve the equations on both connected graphs; the nullspace
    theorem proves independence of the potential. Distances are Mathlib graph distances. A triangle
    witnesses non-bipartiteness in one lift.
