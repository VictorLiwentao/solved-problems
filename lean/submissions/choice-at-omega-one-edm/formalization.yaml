status:
  scope: The stronger graph dichotomy EDM_BG on the full five-letter permutation-model support semantics,
    including the regular-ordinal Ramsey proof for ω₁. The earlier five-row result verifies the choice
    failures in precisely the same model.
  sorry_count: 0
  sorry_in_definitions: 0
