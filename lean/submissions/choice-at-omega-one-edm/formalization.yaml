  - propext
  - Classical.choice
  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: The graph is a Mathlib simple graph. Graph witnesses are explicit injections with a
    single nonstationary support for their entire images. Internal uncountability excludes an injection
    to the pure naturals with supported graph. The finite perfect group is A₅ in the same product
    action and support semantics as the selector failures. External well-ordered recursion uses the
    standard three Lean axioms in the choice ground.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: The well-ordered partition relation at ω₁
    lean: ChoiceOmegaOne.edm_on_rows
    module: SolvedProblems.ChoiceOmegaOneEDM
    status: proved
    note: Every graph on the ground first uncountable ordinal has a countably infinite independent
      sequence or an ω₁-indexed clique.
  - source: Pass the graph dichotomy to a supported carrier
    lean: ChoiceOmegaOne.edm_from_comparison
    module: SolvedProblems.ChoiceOmegaOneEDM
    status: proved
    note: A supported injection from ω₁ gives supported homogeneous witnesses for the pullback of
      an arbitrary graph on the target.
  - source: Erdős–Dushnik–Miller with supported witnesses in the finite-row model
    lean: ChoiceOmegaOne.five_edm
    module: SolvedProblems.ChoiceOmegaOneEDM
    status: proved
    note: Every graph on an internally uncountable supported set of supported elements has one of
      the two graph witnesses in the A₅ product model with nonstationary supports.
