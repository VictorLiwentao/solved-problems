version: v0.4
project:
  name: Cardinal comparability and choice at the first uncountable ordinal
  description: Every graph on an internally uncountable supported carrier in the five-letter permutation
    model has a countably infinite supported independent sequence or a supported clique indexed by
    the first uncountable ordinal. The well-ordered partition theorem and the finite perfect group
    comparison theorem used for this conclusion are both proved. The [five-row theorem](SolvedProblems/ChoiceOmegaOneModel.lean)
    gives the accompanying cardinal comparison and the two failures of choice in this interpretation.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
