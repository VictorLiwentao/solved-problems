version: v0.4
project:
  name: Rado selection and the Boolean prime ideal theorem in ZF
  description: On the represented carriers of a pure extensional ranked set hierarchy, Rado selection
    is equivalent to the existence of a two-valued homomorphism on every nontrivial Boolean algebra.
    The proof constructs a fine ultrafilter on unordered finite samples and a linear order by membership-rank
    recursion. It specializes to Mathlib’s material sets.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
