fidelity:
  divergences: The uniform theorem assumes propositional decidability, an extensional well-founded
    membership hierarchy, separation, powerset, binary union, adjoining one element and transitive
    bounds. It quantifies over represented carriers and externally described families, choices and
    Boolean operations on them. This is a choice-free type-theoretic translation of the argument.
    The ZFSet corollary instantiates the interface in Mathlib. Neither target asserts a syntactic
    consistency or derivability statement about a first-order axiomatization of ZF.
