fidelity:
  divergences: The quantification is over an arbitrary subgroup of the permutation group of an externally
    infinite atom type. Internal subsets are precisely those fixed by the pointwise stabilizer of
    some finite set. The theorem derives its finite spectra, minimality, extraction and independent-block
    structure as needed. This is a semantic support-model version of the original conjecture.
