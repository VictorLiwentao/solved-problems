version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: For every finite-point-support permutation interpretation, an internally amorphous
    atom set has a supported nondegenerate locally finite locally homogeneous pregeometry exactly
    when its internal powerset admits a supported surjective noninjective self-map. Existence on some
    positive finite power and on all positive finite powers are equivalent conditions. The proof constructs
    the model for necessity and the [closure-difference map for sufficiency](SolvedProblems/ProjectiveSufficiency.lean).
