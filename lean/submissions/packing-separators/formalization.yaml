automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: Ranks, windows, and positions start at zero. A marked position carries one of its window
    representatives. The order is generated by going up in a window and crossing between copies of
    the same physical position.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: The packing poset on physical positions
    lean: PackingSeparator.physical_iff
    module: SolvedProblems.PackingSeparators
    status: proved
    note: The generated order on marks equals the comparison of their physical positions, including
      aliases over multiple overlaps.
  - source: Rank propagation
    lean: PackingSeparator.rankTest_iff
    module: SolvedProblems.PackingSeparators
    status: proved
    note: Clipping the distance to m+1 crossings preserves every comparison.
  - source: Main theorem
    lean: PackingSeparator.separator_cutoff
    module: SolvedProblems.PackingSeparators
    status: proved
    note: The packing order and its truncation agree on the existence of a separator.
  - source: The finite rank test
    lean: PackingSeparator.separatorTest_correct
    module: SolvedProblems.PackingSeparators
    status: proved
    note: The Boolean search returns true exactly when a separator exists.
  - source: All copy counts above the overlap
    lean: PackingSeparator.all_lengths
    module: SolvedProblems.PackingSeparators
    status: proved
    note: The finite interval of tests is equivalent to the universal separator property.
  - source: The proposed overlap-two family
    lean: PackingSeparator.proposed_separator
    module: SolvedProblems.PackingSeparators
    status: proved
    note: The last position of the first copy separates the packing for every length of at least two.
