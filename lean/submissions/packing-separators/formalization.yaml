  id: Li2026-packing-separators
  location: https://github.com/VictorLiwentao/solved-problems/tree/ccd7c5af43e57e7758d49febfcf4bbdc26c1ffc6/results/permutation-patterns/packing-separators
  relationship: formalizes
- title: Permutation packings, Part I, section 7, item 5
  location: https://arxiv.org/html/2610.29846v1#S7
  relationship: background
  note: Natasha Blitvić, Mohammed Slim Kammoun and Einar Steingrímsson (§7, item 5)
status:
  scope: The bounded rank test, the cutoff for arbitrary numbers of windows, the finite characterization
    for all j>m, and the proposed family at overlap two.
