version: v0.4
project:
  name: A bounded rank test for separators in permutation-packing posets
  description: For overlap m, a packing of j windows has a separator exactly when the packing with
    min(j,6(m+1)+1) windows has one. A finite rank test decides this condition, and the proposed overlap-two
    family has separators at every length of at least two.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
