version: v0.4
project:
  name: Private list learning can fail at both dimensions one
  description: For every list size k ≥ 2 the planar class has list Littlestone dimension one and monotone
    dimension one, yet even improper private PAC list learning fails at the displayed fixed accuracy
    and confidence. The proof includes a packing bound for arbitrary measurable output spaces and
    sharp examples at its boundary.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
