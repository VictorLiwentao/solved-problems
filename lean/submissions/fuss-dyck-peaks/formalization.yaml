    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: A path with b east steps is encoded by its b vertical run lengths, including zero runs.
    Prefix inequalities test the path at the ends of the east steps. The proof appends one east step,
    counts cyclic shifts of the resulting rational paths, then applies the Gauss–Lucas theorem to
    the auxiliary polynomial.
