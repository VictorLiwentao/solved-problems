version: v0.4
project:
  name: The zeros of the Fuss–Dyck peak polynomials do not depend on the Fuss parameter
  description: For a fixed number of north steps and peaks, the Fuss–Dyck peak polynomial at each
    positive integer slope is an explicit positive multiple of the same polynomial. Every zero is
    real and nonpositive, and its multiplicity is independent of the slope.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
