version: v0.4
project:
  name: How precisely must one measure resistance to recover every missing edge?
  description: For every n ≥ 4, two different connected labeled graphs agree on all known adjacencies,
    while the same four rational measurements approximate both graphs’ effective resistances on every
    unknown pair with error exactly 1/[n(n−2)]. No decoder can always recover the graph at that radius.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
