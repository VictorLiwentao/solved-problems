    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: The graphs have four distinguished vertices and k additional vertices so n = k+4 covers
    every case. The known view masks both orientations of each of the four unordered pairs. True resistances
    are voltage drops for the ordinary unit-conductance Laplacian. The indistinguishability theorem
    quantifies over every decoder accepting the known entries and rational answers.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Exact Laplacian formula after deleting a matching
    lean: ResistanceRecovery.matching_potential
    module: SolvedProblems.ResistanceRecovery
    status: proved
    note: The displayed potential solves the unit source/sink equations on a complete graph minus
      the two-element orbits of an arbitrary involution, for more than two vertices.
  - source: Four unknown pairs, exact readings
    lean: ResistanceRecovery.reading
    module: SolvedProblems.ResistanceRecovery
    status: proved
    note: Every missing pair has the stated resistance under both deletions.
  - source: Sharp obstruction
    lean: ResistanceRecovery.four_unknown_pairs
    module: SolvedProblems.ResistanceRecovery
    status: proved
    note: Two distinct connected graphs agree on all specified known data and admit the same rational
      transcript at the stated radius.
  - source: Consequence for every decoder
    lean: ResistanceRecovery.no_decoder
    module: SolvedProblems.ResistanceRecovery
    status: proved
    note: No decoding function always recovers the graph from these observations at that error radius.
