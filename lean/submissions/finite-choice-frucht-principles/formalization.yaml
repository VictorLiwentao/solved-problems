version: v0.4
project:
  name: Finite choice implies Frucht's theorem
  description: Each of the five principles in Pinsky’s Appendix 6.1 implies a simple graph representation
    of every group. Besides joint finite choice, these are the ordering principle, order extension,
    the Boolean prime ideal theorem, and choice for nonempty well-orderable families. [Finite-choice
    construction](SolvedProblems/FiniteFrucht.lean)
