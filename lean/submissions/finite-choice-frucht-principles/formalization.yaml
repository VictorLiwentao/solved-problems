    is pending.
alignment:
  statements:
  - source: The five forward implications, remaining four cases
    lean: FiniteFrucht.four_principles_action
    module: SolvedProblems.FiniteFruchtPrinciples
    status: proved
    note: Each of ordering, order extension, Boolean prime ideal, and choice for nonempty well-orderable
      families gives a full graph action for every group.
  - source: Obtaining the finite selector from a linear order
    lean: FiniteFrucht.selector_of_order
    module: SolvedProblems.FiniteFruchtPrinciples
    status: proved
    note: Taking the least member of a nonempty finite family of labels determines the required selector.
