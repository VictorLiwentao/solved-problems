fidelity:
  divergences: The theorem constructs the whole graph automorphism action from any one of the four
    stated principles. Boolean prime ideal is the assertion that each nontrivial Boolean algebra admits
    a two-valued homomorphism. Order extension extends a given strict partial order. The proof derives
    the finite selector needed by the graph construction.
