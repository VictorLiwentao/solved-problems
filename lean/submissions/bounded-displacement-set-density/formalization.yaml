version: v0.4
project:
  name: Dense set-valued generation under bounded displacement
  description: For a countable family of infinite languages, a finite-witness criterion characterizes
    the target-specific lower densities attainable on full repetition-free texts under bounded displacement.
    A generator depending only on the observed set attains every feasible guarantee.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
