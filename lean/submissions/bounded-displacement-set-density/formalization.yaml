  notes: The project checked the formal statements against the cited draft. Independent human mathematical
    and priority review is pending.
alignment:
  statements:
  - source: Main theorem, “The noiseless set-valued density problem”
    lean: SetDensity.densityCriterion
    module: SolvedProblems.SetDensity
    status: proved
    note: The same finite witnesses characterize arbitrary history-based generation and generation
      from the current seen set, with infinite fresh outputs.
