  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Set membership is an arbitrary binary relation satisfying the displayed fragment of
    ZF. The separation predicate must be represented by an actual finite Mathlib first-order formula
    in the pure membership language. Kuratowski pairs, graphs, the internal exponential and its coordinate-update
    endomorphism are constructed in the model. Specializing X to the model's own powerset gives the
    paper's positive-power implication.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Dual Dedekind infinity lifts to any nonempty internal exponent
    lean: ProjectiveZF.coordinateLift
    module: SolvedProblems.ProjectiveZFCoordinate
    status: proved
    note: The internal graph changes one coordinate of a function. It is surjective and has an actual
      collision whenever the starting self-map does.
