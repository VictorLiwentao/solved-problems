version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: In every model of Extensionality, Pairing, Union, Power Set and first-order Separation,
    a noninjective self-surjection of an internal set X gives one on its internal function space from
    any nonempty index set to X. The construction changes one coordinate and forms the resulting graph
    by Separation. The [full finite-support permutation equivalence](SolvedProblems/ProjectivePermutation.lean)
    is proved separately.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
