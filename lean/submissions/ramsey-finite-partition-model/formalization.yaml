version: v0.4
project:
  name: An infinite poset with no infinite chain or antichain in the finite partition model
  description: In Bruce’s finite partition model, every infinite supported family of subsets of the
    atoms modulo finite changes contains both a strictly comparable pair and an incomparable pair.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
