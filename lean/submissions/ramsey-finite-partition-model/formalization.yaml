- title: Banerjee’s questions on infinite combinatorics without choice
  location: https://arxiv.org/abs/2109.05914v1
  relationship: background
  note: Amitayu Banerjee (order and Ramsey parts of Question 8.1 in v1, later Question 7.1)
status:
  scope: The order and Ramsey conclusions for the paper’s explicit quotient. Infinitude, support for
    points, permutation invariance of the order, and the two colours on every infinite supported family
    are proved together.
  sorry_count: 0
  sorry_in_definitions: 0
