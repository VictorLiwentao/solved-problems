  - Classical.choice
  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: The countable atom set is represented by the natural numbers. Predicates modulo the
    cofinite filter give the quotient. Invariance under all permutations preserving the fibres of
    a finite colouring expresses finite partition support. The proof uses the external presentation
    of Bruce’s model in the draft.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Main theorem, finite partition supports and the comparability colouring
    lean: SolvedProblems.PartitionRamsey.finitePartitionRamsey
    module: SolvedProblems.PartitionRamsey
    status: proved
    note: Both colours occur on every infinite supported subfamily of the infinite quotient.
