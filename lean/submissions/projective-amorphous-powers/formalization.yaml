version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: For codes with a finite core and countably many equally sized finite blocks, every
    map commuting with block permutations has the manuscript’s uniform finite bound on its forward
    orbits. Every such surjection is injective and has a common finite exponent.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
