automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Each coordinate is a finite/cofinite flag and an actual finite subset of a finite core
    plus countably many blocks with labelled positions. All permutations of the block indices act.
    The cardinality bound holds for every finite number of coordinates. This isolates the final obstruction
    in the countable model; it does not identify arbitrary ambient Lean types with amorphous sets.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Uniform bound
    lean: ProjectiveBlocks.blockOrbitBound
    module: SolvedProblems.ProjectiveBlocks
    status: proved
    note: The number of distinct iterates is at most the explicit bound of the manuscript.
  - source: Uniform bound, final contradiction
    lean: ProjectiveBlocks.equivariantSurjection
    module: SolvedProblems.ProjectiveBlocks
    status: proved
    note: Surjectivity implies that the factorial of the orbit bound is a common period and that the
      map is injective.
