  location: https://arxiv.org/abs/2510.13508
  relationship: background
  note: Yifan Hu, Ruihuan Mao and Guozhen Shen (§6, Questions 6.1 and 6.2, published in 2026)
status:
  scope: The uniform bound and surjectivity argument in the degenerate countable block model of Hu,
    Mao and Shen’s Questions 6.1 and 6.2.
