version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: An encoded self-surjection on finite/cofinite tuples is injective if its first-order
    graph has an elementarily equivalent model on a finite core and countably many finite blocks invariant
    under block permutations. The explicit uniform bound on forward orbits holds in the block model.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
