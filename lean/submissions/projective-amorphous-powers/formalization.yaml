fidelity:
  divergences: The original carrier and its self-map are arbitrary. Graph relations record the finite
    supports and flags. In an elementarily equivalent finite-type model the proof transfers functionality,
    surjectivity and injectivity in both directions. In the block model, finite spectra of tuple types
    are derived from the block symmetries. The theorem states the elementary-equivalence hypothesis
    explicitly.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Uniform bound
    lean: ProjectiveBlocks.blockOrbitBound
    module: SolvedProblems.ProjectiveBlockTransfer
    status: proved
    note: The number of distinct iterates is at most the explicit bound of the manuscript.
  - source: Uniform bound, final contradiction
    lean: ProjectiveBlocks.equivariantSurjection
    module: SolvedProblems.ProjectiveBlockTransfer
    status: proved
    note: Surjectivity implies that the factorial of the orbit bound is a common period and that the
      map is injective.
  - source: Transfer of the coded graph
    lean: ProjectiveTransfer.transferGraph
    module: SolvedProblems.ProjectiveBlockTransfer
    status: proved
    note: A total map transfers through elementary equivalence and finite realized type spectra. Its
      surjectivity and injectivity are preserved and reflected.
  - source: Countable block-model contradiction
    lean: ProjectiveTransfer.obstructionOfBlockModel
    module: SolvedProblems.ProjectiveBlockTransfer
    status: proved
    note: Elementary equivalence with a block-permutation-invariant model implies every encoded surjection
      is injective.
