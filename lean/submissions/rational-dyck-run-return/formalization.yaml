  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: North steps are represented by their columns. The run is the first missing positive
    multiple of the stride, and a return is a row where the north step starts on its floor boundary.
    The flag bounds use the minimum over all columns requiring a given residual step, which equals
    the bound at the first such column. The proof establishes the exact count. The complexity estimate
    for evaluating it is separate.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Formula (1), counting one boundary-to-boundary segment
    lean: RationalReturns.segment_determinant
    module: SolvedProblems.RationalReturns
    status: proved
    note: The determinant and the infeasible cases are derived from the set of physical north-step
      words.
  - source: Main theorem, formula (2)
    lean: RationalReturns.joint_run_return
    module: SolvedProblems.RationalReturns
    status: proved
    note: The run and return statistics are computed on the original paths. Cutting paths at marked
      returns and applying binomial inversion gives the formula.
