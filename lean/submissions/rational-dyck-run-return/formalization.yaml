version: v0.4
project:
  name: An explicit joint run–return formula for rational Dyck paths
  description: A binomial determinant counts the path segments between two boundary contacts. Powers
    of the resulting matrix give the exact number of paths with a specified run and return count.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
