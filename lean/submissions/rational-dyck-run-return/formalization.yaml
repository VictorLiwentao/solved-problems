  relationship: background
  note: Lilan Dai, Shishuo Fu and Dun Qiu (§5)
status:
  scope: The printed segment determinant and the alternating matrix-power formula for rational Dyck
    paths of width at least their positive height. This includes noncoprime rectangles, ordinary runs,
    and ratio-runs.
