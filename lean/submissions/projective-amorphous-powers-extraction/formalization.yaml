version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: From finite realized type spectra and any sequence of finite blocks over a finite core,
    Ramsey thinning constructs a rationally indexed order-indiscernible sequence based on the original
    sequence. The related comparisons prove [total indiscernibility under the independence hypotheses](SolvedProblems/ProjectiveIndiscernibles.lean),
    [the local geometry](SolvedProblems/ProjectiveHomogeneity.lean) and [elementary transfer of the
    block obstruction](SolvedProblems/ProjectiveBlockTransfer.lean).
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
