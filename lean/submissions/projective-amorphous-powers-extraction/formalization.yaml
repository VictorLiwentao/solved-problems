    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Basedness requires each finite increasing subtuple to have a complete type realized
    by an increasing subtuple of the original sequence. The finite marked core remains fixed, and
    no order indiscernibility is assumed of the input sequence.
