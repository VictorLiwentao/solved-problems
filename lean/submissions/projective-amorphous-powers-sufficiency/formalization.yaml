version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: A supported nondegenerate locally finite locally homogeneous pregeometry yields an
    explicit noninjective surjection, S ↦ cl(S) ∖ S on finite sets, and supported noninjective self-surjections
    of every positive finite power of the internal powerset of an amorphous set. Additional comparisons
    establish the [finite type hypotheses](SolvedProblems/ProjectivePowerModel.lean), [indiscernible
    extraction](SolvedProblems/ProjectiveExtraction.lean), [total indiscernibility](SolvedProblems/ProjectiveIndiscernibles.lean),
    [local homogeneity](SolvedProblems/ProjectiveHomogeneity.lean) and [block-model transfer](SolvedProblems/ProjectiveBlockTransfer.lean).
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
