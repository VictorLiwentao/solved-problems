fidelity:
  divergences: An enumeration is an increasing computable array of binary answers. Its modulus is
    the least stage at which every answer through x is final. The oracle reduction is witnessed by
    an ordinary partial recursive program on x and a code of those finitely many answers. The proof
    explicitly constructs the search and proves the finite prefix Turing reducible to the characteristic
    oracle. The implication also holds for stage arrays that can have infinite stages.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Strong settling domination implies a Turing reduction with use x
    lean: StrongSettling.strong_imp_reducible
    module: SolvedProblems.SettlingReduction
    status: proved
    note: Every pair of strongly comparable enumerations satisfies the concrete finite-prefix program
      specification and Mathlib Turing reducibility.
  - source: Modulus bound suffices
    lean: StrongSettling.reduction_of_eventual
    module: SolvedProblems.SettlingReduction
    status: proved
    note: Eventual comparison on identical inputs gives the bounded-use program.
  - source: Oracle-model correspondence
    lean: StrongSettling.IdentityUse.turing
    module: SolvedProblems.SettlingReduction
    status: proved
    note: Any such partial recursive finite-prefix computation is recursive in its characteristic
      oracle in Mathlib’s Turing-degree sense.
