version: v0.4
project:
  name: Countable orders of strong settling times
  description: If the settling modulus of one computably enumerable presentation eventually dominates
    another on the same input, the dominated membership function is computable by querying the other
    set only at 0 through x. This proves the manuscript’s forward Turing reduction from strong settling
    domination.
