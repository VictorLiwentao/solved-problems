automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Inputs are arbitrary finite connected symmetric nonnegative real conductance matrices
    with zero diagonal, entries bounded by W, equal known entries, and distinct candidate levels at
    least Δ apart. This includes the finite rational alphabet in the manuscript. The stability proof
    uses a matrix inverse identity and Loewner order. Grounding is proved to give exactly the voltage
    drop for any solution of Kirchhoff’s equations. The supremum over uniquely identifying error levels
    quantifies over all queries restricted to the unknown pairs and all compatible connected labeled
    graphs.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Stability of grounded inverse Laplacians
    lean: ResistanceRecovery.inverse_trace_bound
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: A resolvent trace inequality lower bounds the squared Frobenius variation at scale 1/(nW)².
  - source: Finite-alphabet exact identifiability below the stated radius
    lean: ResistanceRecovery.noisy_identifiability
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: Any two compatible candidates coincide when the readings have errors bounded by η below
      Δ/(nW)².
  - source: Existence of a unit-current potential
    lean: ResistanceRecovery.weighted_kirchhoff
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: The grounded inverse gives a potential solving all the actual weighted Laplacian equations.
  - source: Independence of grounding and voltage reference
    lean: ResistanceRecovery.weighted_voltage
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: The measured resistance equals the voltage difference of every potential solving the unit-current
      equations.
  - source: Binary recovery at error below 1/n²
    lean: ResistanceRecovery.binary_identifiability
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: For all connected graphs and every list of missing pairs the measured data identify at most
      one compatible graph.
  - source: Uniform unweighted radius
    lean: ResistanceRecovery.sharp_bounds
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: For each n=k+4 the supremal radius is bounded below by 1/n² and above by 1/[n(n−2)].
  - source: Asymptotically sharp constant
    lean: ResistanceRecovery.sharp_limit
    module: SolvedProblems.ResistanceRadius
    status: proved
    note: The normalized supremum tends to one as n increases.
