version: v0.4
project:
  name: How precisely must one measure resistance to recover every missing edge?
  description: On a connected weighted graph, compatible measurements on the missing pairs uniquely
    identify all conductances when η < Δ/(nW)². For unweighted graphs the uniformly identifiable radius
    lies between 1/n² and 1/[n(n−2)] for every n ≥ 4, and n² times that radius tends to one. [Four-pair
    ambiguity](SolvedProblems/ResistanceRecovery.lean)
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
