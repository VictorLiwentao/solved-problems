fidelity:
  divergences: The theorem covers a probability distribution on complete finite schedules and decoders,
    allows every legal maximal-independent-set oracle and requires correct recovery of every graph
    of maximum degree at most Δ. For 2t ≤ n choose 2, the explicit error lower bound is exp(−4608t/Δ²)/4
    − exp(−Δ/4). The asymptotic statement gives arbitrarily large n and a degree parameter for each
    constant C and real confidence exponent a > 0.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Quantitative lower bound for randomized nonadaptive recovery
    lean: MISQueries.randomized_lower
    module: SolvedProblems.MISQueries
    status: proved
    note: The failure parameter is bounded below for every legal degree cap and query count satisfying
      the displayed hypotheses.
  - source: Negative answer to the proposed high-confidence bound
    lean: MISQueries.no_log_ratio_bound
    module: SolvedProblems.MISQueries
    status: proved
    note: For each exponent and multiplicative constant there are arbitrarily large sizes at which
      every learner obeying the proposed budget fails.
