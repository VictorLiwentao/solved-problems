version: v0.4
project:
  name: High-confidence graph reconstruction with maximal independent set queries
  description: Randomized nonadaptive learners seeking exact recovery of a labeled graph of maximum
    degree at most Δ from maximal-independent-set queries have a quantitative error lower bound. For
    each fixed a > 0, no uniform O(Δ² log(n/Δ)) query bound achieves failure probability n⁻ᵃ.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
