    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Small sets have asymptotic density zero, expressed by all reciprocal integer upper
    bounds. Exceptional support sections may be large at finitely many rows. Permutations may act
    in infinitely many rows. A supported injection into the naturals must be invariant under the whole
    pointwise stabilizer of its support.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Tallness of the natural-density-zero ideal
    lean: EDMRows.density_tall
    module: SolvedProblems.EDMIntersection
    status: proved
    note: Every infinite set of positions contains an infinite subset with asymptotic density zero.
  - source: Failure of the countable union theorem
    lean: EDMRows.density_row_counterexample
    module: SolvedProblems.EDMIntersection
    status: proved
    note: There is an invariant countably indexed disjoint cover by internally denumerable rows, while
      the full atom set has no supported injection into the natural numbers.
  - source: Intersection of relative supports
    lean: EDMRows.supports_intersection
    module: SolvedProblems.EDMIntersection
    status: proved
    note: Any two supports whose sections are both small or coincide in each row have an intersection
      supporting the same point.
