version: v0.4
project:
  name: The Erdős–Dushnik–Miller theorem and countable unions
  description: With the density-zero moved-set ideal on each row and the full product action, every
    row is invariant and has a supported enumeration. Their disjoint union has no supported injection
    to the natural numbers. The point stabilizers satisfy the intersection-of-supports lemma used
    in the graph proof.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
