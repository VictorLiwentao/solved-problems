  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: Ranks start at zero. An option-valued output allows a generator to leave the target.
    The proof uses positive block quotas also at density zero, and schedules each rank once to cover
    the entire complement of the core. The draft’s separate discussion of prescribing only the lower
    density is outside this theorem.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: The singleton conjecture, attainment, quota lemma and density argument
    lean: SingletonDensity.minimax
    module: SolvedProblems.SingletonDensity
    status: proved
    note: The adversary supplies an injective infinite enumeration for every legal deterministic generator.
      A single set-driven schedule proves attainment.
