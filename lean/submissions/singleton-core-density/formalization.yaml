version: v0.4
project:
  name: The singleton sparse-core density game
  description: For every exact core density α from zero through one half, a set-driven generator attains
    lower output density 1−α. For every legal history-dependent generator there is a core on which
    even its upper output density is at most 1−α.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
