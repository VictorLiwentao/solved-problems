version: v0.4
project:
  name: The homomorphism counts determined by shortest-path graph refinement
  description: A finite simple pattern has invariant homomorphism count under all-round shortest-path
    refinement exactly when it is a forest. This holds for all finite hosts with distance ∞ between
    components and for connected hosts alone. No family of ordinary homomorphism counts characterizes
    the refinement in either scope.
