  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Pattern characterization in both host classes
    lean: ShortestPathWL.classification
    module: SolvedProblems.ShortestPathClassification
    status: proved
    note: A finite simple pattern is countable exactly when it is acyclic, permitting either all finite
      hosts or only connected hosts.
  - source: Nonexistence of a homomorphism characterization
    lean: ShortestPathWL.no_hom_family
    module: SolvedProblems.ShortestPathClassification
    status: proved
    note: For either host class, no family of ordinary pattern counts defines exactly the shortest-path
      refinement equivalence.
  - source: Separating hosts
    lean: ShortestPathWL.cubic_distinction
    module: SolvedProblems.ShortestPathClassification
    status: proved
    note: The two specified cubic graphs are distinguished by shortest-path refinement.
