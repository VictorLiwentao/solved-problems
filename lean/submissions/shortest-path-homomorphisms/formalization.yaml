fidelity:
  divergences: The finite-host theorem uses extended natural distances. Cyclic patterns inherit connected
    witnesses from the joint-distance construction by forgetting resistance at each refinement round.
    The negative result quantifies over arbitrary families of finite simple patterns with no bound
    on their order.
review:
