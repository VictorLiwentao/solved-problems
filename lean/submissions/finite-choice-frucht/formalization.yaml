version: v0.4
project:
  name: Finite choice implies Frucht's theorem
  description: Choice for arbitrary families of nonempty finite sets gives, for every group, an undirected
    simple graph whose full automorphism group is isomorphic to that group. The graph construction
    and its inverse action are explicit.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
