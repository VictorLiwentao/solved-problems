  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Finite choice implies Frucht’s theorem, explicit action
    lean: FiniteFrucht.finite_choice_action
    module: SolvedProblems.FiniteFrucht
    status: proved
    note: The chosen graph carries a faithful group action accounting for all its automorphisms, with
      an explicit inverse.
  - source: Main implication, bundled automorphism group
    lean: FiniteFrucht.finite_choice_frucht
    module: SolvedProblems.FiniteFrucht
    status: proved
    note: Every group has a simple graph whose full group of automorphisms is isomorphic to it.
  - source: Rigidity of the finite-selector structure
    lean: FiniteFrucht.selector_fixes
    module: SolvedProblems.FiniteFrucht
    status: proved
    note: The action of any structure automorphism on the original labels is the identity.
