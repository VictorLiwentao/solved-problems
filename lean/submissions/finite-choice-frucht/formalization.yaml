fidelity:
  divergences: Finite sets are subsets for which a finite listing exists; a listing is not supplied
    with each set. The selector is joint across finite sizes. A unique translation extends to each
    graph automorphism, and the inverse reads its value at the identity vertex. The model-uniform
    construction uses no ranking of the ambient sets or choice of representatives.
review:
