fidelity:
  divergences: The colour graph has proper colourings as vertices and adjacency exactly at Hamming
    distance one. An induced copy is a vertex subset whose induced graph is isomorphic to H. The rational
    polynomial evaluates to this count at each nonnegative integer palette size. The target-dependent
    connected probe uses all single recolourings and simultaneous recolourings on nonedges; its reconstructed
    host directions are shown to preserve both edges and nonedges.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Graph-dependent reconstruction conjecture
    lean: ColourProbe.polynomial_reconstruction
    module: SolvedProblems.ColourProbePolynomial
    status: proved
    note: Every finite target has one connected test graph of the stated size whose induced-colouring-graph
      polynomial distinguishes it from every nonisomorphic finite host.
  - source: Interpretation of the polynomial
    lean: ColourProbe.countPolynomial_eval
    module: SolvedProblems.ColourProbePolynomial
    status: proved
    note: At each natural palette size the rational polynomial evaluates to the number of unlabelled
      induced copies in the proper colouring graph.
  - source: Pointwise counting version
    lean: ColourProbe.one_colouring_probe
    module: SolvedProblems.ColourProbePolynomial
    status: proved
    note: Equality of the actual unlabelled induced-copy counts for every finite palette already implies
      isomorphism, with the same probe size bound.
