version: v0.4
project:
  name: One induced colouring-graph polynomial for each graph
  description: For every finite simple graph G on n vertices there is a connected test graph H with
    at most 1+n(n+1)+choose(n,2)(n+1)^2 vertices. Equality of H's induced-copy polynomials in the
    proper colouring graphs of G and any finite graph G' forces G and G' to be isomorphic.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
