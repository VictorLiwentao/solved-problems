automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: The full row groups, the alternating group on five letters, ground ω₁, its club ideal,
    group orbits and ultrafilters are concrete Mathlib or defined objects. The escaping-commutator
    construction and finite Cantor-branch overlap are proved. Set and point symmetry are explicit
    stabilizer conditions. The ambient ground universe uses choice, as in the manuscript. The 990-line
    standalone reference checks against Mathlib alone.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Finite ultrafilter description of a countable orbit
    lean: ChoiceOmegaOne.descriptors_of_perfect
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: In every action of a full power of a fixed finite perfect group, the point stabilizer on
      coordinate complements is exactly described by membership in finitely many ultrafilters.
  - source: Countable orbits are finite
    lean: ChoiceOmegaOne.countable_orbit_finite
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: Simultaneous ultrafilter evaluation separates the orbit points using a finite product of
      the finite group.
  - source: Cardinal comparison for internal set carriers
    lean: ChoiceOmegaOne.set_comparison
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: Every supported set of supported elements of an ambient full product action has a supported
      injection into the naturals or a supported injection from the ground first uncountable ordinal.
  - source: Individual enumerations have singleton row supports
    lean: ChoiceOmegaOne.enumerations_supported
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: Fixing the corresponding coordinate fixes each value of any specified enumeration of its
      five-letter row.
  - source: Sizes of the two row families
    lean: ChoiceOmegaOne.row_sizes
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: The first row has five elements and its product with the natural numbers is denumerable.
  - source: Five-letter row permutation-model separation
    lean: ChoiceOmegaOne.five_row_model
    module: SolvedProblems.ChoiceOmegaOneModel
    status: proved
    note: The same full alternating-group product with nonstationary supports gives cardinal comparison
      and excludes selectors for the five-element rows and their denumerable enlargements.
