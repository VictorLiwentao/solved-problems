version: v0.4
project:
  name: Cardinal comparability and choice at the first uncountable ordinal
  description: For the full product of the alternating group on five letters with nonstationary supports,
    every supported set of supported elements admits a supported injection to the naturals or an injection
    from ω₁ with supported graph. In this same interpretation the family of five-letter rows and the
    denumerable rows obtained by adjoining a natural-number coordinate have no supported selector.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
