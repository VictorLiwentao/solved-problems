    lean: ReluStability.stability
    module: SolvedProblems.ReluStability
    status: proved
    note: On a dense open parameter set of full Lebesgue measure, a continuous family of homeomorphisms
      preserves the entire labeled activation partition, its cell closures, their small inductive
      dimensions and closure inclusion, simultaneously on the whole input space.
