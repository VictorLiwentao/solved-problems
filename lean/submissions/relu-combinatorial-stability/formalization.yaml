version: v0.4
project:
  name: Generic combinatorial stability of deep ReLU networks
  description: For a fixed ReLU architecture in any finite input dimension, outside finitely many
    proper polynomial zero loci, nearby parameters admit a jointly continuous family of ambient homeomorphisms
    preserving every ternary activation cell, its closure, its small inductive dimension, and face
    incidence. The base homeomorphism is the identity.
