fidelity:
  divergences: The full network is a finite acyclic sequence of affine gates followed by ReLU. Coefficients
    can be arbitrary multivariate polynomials in the real parameters, which includes independent weights
    and biases, fixed coefficients and parameter sharing. A canonical cell is indexed by the signs,
    including zero, of all preactivations. The exceptional set is an explicit finite union of proper
    polynomial zero sets. A constructive dimension-by-dimension transport proves the result without
    assuming Hardt's theorem.
