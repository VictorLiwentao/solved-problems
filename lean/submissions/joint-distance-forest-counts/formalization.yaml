version: v0.4
project:
  name: What shortest paths and resistance can count together
  description: Equal joint-refinement histograms on finite connected hosts imply equal ordinary homomorphism
    counts for every finite forest. Two explicit connected cubic graphs agree on all forest counts
    but joint refinement distinguishes them. An exact independent-set sum computes homomorphisms into
    a cone.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
