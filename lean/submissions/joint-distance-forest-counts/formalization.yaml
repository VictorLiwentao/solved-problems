fidelity:
  divergences: The pattern is an arbitrary finite acyclic simple graph, including isolated vertices
    and the empty forest. Homomorphisms may identify vertices. Host labels are ordinary graph distance
    and effective resistance via the unit grounded Laplacian. Forest equality concerns each finite
    forest. The eight-vertex witness is checked as a pair of concrete finite graphs.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Forest-positive direction
    lean: JointForest.forests_countable
    module: SolvedProblems.JointForest
    status: proved
    note: Joint histogram equality on all refinement rounds preserves all forest homomorphism counts.
  - source: Eight-vertex cubic witness
    lean: JointForest.forest_pair
    module: SolvedProblems.JointForest
    status: proved
    note: Two connected cubic hosts have equal counts for every forest but different joint-refinement
      histograms.
  - source: Cone-count identity
    lean: JointForest.cone_hom_count
    module: SolvedProblems.JointForest
    status: proved
    note: Homomorphisms into a cone decompose over independent pattern subsets sent to the apex.
