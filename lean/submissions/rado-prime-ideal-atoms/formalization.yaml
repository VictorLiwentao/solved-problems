version: v0.4
project:
  name: Rado selection and the Boolean prime ideal theorem in ZF
  description: With atoms, the Boolean prime ideal theorem on represented carriers is equivalent to
    Rado selection together with linear orderability of each set of atoms. The [pure-set equivalence](SolvedProblems/RadoZFSet.lean)
    also specializes to Mathlib’s material sets. [Pure-set statement](Statements/Rado.lean)
