fidelity:
  divergences: The parameterized universe has well-founded rank, relative extensionality for nonatoms,
    and explicit set constructors used by the argument. Propositions have supplied decisions. AtomOrder
    quantifies over one represented set of atoms at a time. The theorem covers the atom clause of
    the manuscript in this semantic translation and uses no Classical.choice.
