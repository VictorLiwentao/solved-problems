version: v0.4
project:
  name: No universal cutoff for prescribed consecutive-pattern packing
  description: For every positive cutoff, two patterns of the same length and overlap have equal packing
    counts through that cutoff and different counts at the next window count. Both sequences of counts
    are unbounded.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
