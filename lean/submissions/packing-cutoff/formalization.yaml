    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel Codex agents developed and checked the Lean proofs using the pinned Lean
      4 and Mathlib release.
    prompting_notes: The repository owner requested another five draft proofs verified end to end.
  notes: The individual draft credits AI assistance in preparing the mathematical text. Spend and
    wall time were not tracked.
fidelity:
  divergences: Permutations are represented by strict total orders of the labelled positions. A count
    of one is stated as existence and uniqueness. An injection of every finite size expresses unboundedness.
    The separate closed form for every count is outside this claim.
review:
  status: self-assessed
  notes: The project checked the formal statements against the cited draft. Independent human mathematical
    and priority review is pending.
alignment:
  statements:
  - source: Main theorem and the construction in “Why every proposed cutoff fails”
    lean: PackingCutoff.noUniversalCutoff
    module: SolvedProblems.PackingCutoff
    status: proved
    note: The first h counts are one for each pattern. At the next count one has at least two packings
      and the other has exactly one.
