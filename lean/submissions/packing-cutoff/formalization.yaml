  location: https://github.com/VictorLiwentao/solved-problems/tree/ccd7c5af43e57e7758d49febfcf4bbdc26c1ffc6/results/permutation-patterns/packing-cutoff
  relationship: formalizes
- title: Permutation packings, Part I, section 7, item 8
  location: https://arxiv.org/html/2610.29846v1#S7
  relationship: background
  note: Natasha Blitvić, Mohammed Slim Kammoun and Einar Steingrímsson (§7, item 8)
status:
  scope: The main no-cutoff theorem for every positive cutoff. The proof gives two explicit offsets
    on three-slot blocks.
  sorry_count: 0
  sorry_in_definitions: 0
