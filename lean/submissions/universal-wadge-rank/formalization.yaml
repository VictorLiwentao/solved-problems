version: v0.4
project:
  name: One character sequence realizes complete Borel rank for every ideal
  description: The same continuous map reduces countably many membership tests for every proper ideal
    to convergence along the explicit circle characters 2^((n+2)^2). The variable-threshold theorem
    and its group-character specialization prove the two Borel upper bounds from the manuscript. Exact-rank
    completeness is proved under the Borel Wadge alternative.
