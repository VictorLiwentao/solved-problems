alignment:
  statements:
  - source: Coding countably many membership tests
    lean: UniversalWadge.productReduction
    module: SolvedProblems.UniversalWadge
    status: proved
    note: The continuous code simultaneously reduces the countable power of every proper ideal to
      its circle-character convergence subgroup.
  - source: Extension to arbitrary Polish domains
    lean: UniversalWadge.thresholdRanks
    module: SolvedProblems.UniversalWadge
    status: proved
    note: Every continuous real sequence has the stated multiplicative-rank and additive-to-next-multiplicative-rank
      upper bounds on its ideal-convergence locus.
  - source: Kwela's question about Polish-group characters
    lean: UniversalWadge.characterRanks
    module: SolvedProblems.UniversalWadge
    status: proved
    note: The two upper bounds apply to continuous circle-valued characters, including the multiplicative
      rank-three bound.
  - source: From exact rank to completeness, under Borel Wadge's lemma
    lean: UniversalWadge.rankTransfer
    module: SolvedProblems.UniversalWadge
    status: proved
    note: An exact multiplicative rank and the usual Wadge alternative give reductions of every source
      set of that multiplicative class to the explicit subgroup. The source can be any perfectly normal
      space satisfying that alternative.
