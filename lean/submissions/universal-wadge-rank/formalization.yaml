fidelity:
  divergences: The circle is AddCircle 1 with its quotient norm and the convergence locus is a checked
    additive subgroup. A single uniformly convergent dyadic sum codes the ideal's countable product
    for every proper ideal containing all finite subsets. Additive and multiplicative Borel classes
    are generated from open sets by countable unions and lower-level complements at ordinal indices.
    The variable-threshold proof uses the Baire category filter on the real threshold parameter and
    works for arbitrary real-valued continuous functions on any topological space. The conditional
    result assumes the usual two-sided Borel Wadge reducibility alternative for the source and Cantor
    space and derives the required lower-rank reductions from the ideal's minimal rank.
