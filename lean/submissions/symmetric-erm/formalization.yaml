version: v0.4
project:
  name: A logarithmic gap between empirical risk minimizers under label symmetry
  description: For arbitrarily large finite label-symmetric multiclass problems, two deterministic
    proper empirical risk minimizers differ by a factor of order at least log d in realizable sample
    complexity, where d is the Natarajan dimension. Error and confidence parameters are both 1/4.
