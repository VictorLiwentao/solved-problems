fidelity:
  divergences: For r ≥ 2 the construction has B = 4^r blocks and B ≤ d ≤ Br. Both rules minimize empirical
    loss even on unrealizable samples. For their least thresholds g and b, g is positive, g ≤ 64B,
    Br < 2b and floor(log₂ d)g ≤ 384b. Every law on the finite instance space is included.
