  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Main logarithmic-separation theorem
    lean: SymmetricERM.logarithmicGap
    module: SolvedProblems.SymmetricERM
    status: proved
    note: The finite classes are invariant under every permutation of the label set, both learners
      are proper empirical risk minimizers, and the actual realizable distribution-free sample complexities
      satisfy the logarithmic lower bound on their ratio.
