fidelity:
  divergences: For a first-order structure with finite realized type spectra and minimality, the theorem
    assumes an order-indiscernible rationally indexed sequence of independent algebraic blocks over
    a fixed finite core. It proves equality of marked tuple types under every permutation of the rationals,
    including tuples with repeated block indices.
