version: v0.4
project:
  name: Projective type and self-surjections of power sets
  description: Independent algebraic blocks in a rational order-indiscernible sequence are totally
    indiscernible over the named core under the stated finite-type and minimality hypotheses. The
    compared results also establish [local homogeneity of algebraic closure](SolvedProblems/ProjectiveHomogeneity.lean)
    and [block-model transfer and the finite-orbit obstruction](SolvedProblems/ProjectiveBlockTransfer.lean).
