version: v0.4
project:
  name: Countable orders of strong settling times
  description: A dominant settling modulus makes every total program eligible at all sufficiently
    large inputs. Eligibility for arbitrary programs is computably enumerable and decidable with oracle
    queries bounded by the input. A computable compiler supplies majorants; actual response entries
    between final markers yield the full strong comparison between rows. The [identity-use reduction](SolvedProblems/SettlingReduction.lean)
    then gives Turing reducibility.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
