fidelity:
  divergences: The interpreter and oracle reducibility are Mathlib’s. The majorants use a running
    sum as the finite monotone envelope and strictly dominate the original functions. The row comparison
    assumes the two specified kinds of requests result in genuine entry events below the previous
    final marker, quantified for each sufficiently late interval. From these hypotheses it proves
    domination for all pairs of total computable functions.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Enumerating eligible computations
    lean: StrongSettling.eligibility_re
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: A single ordinary computably enumerable predicate recognizes bounded-fuel successes from
      the stage approximation, uniformly in the program and input.
  - source: Deciding eligibilities with the base oracle
    lean: StrongSettling.eligibility_decided
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: Queries through x suffice to decide bounded success or failure on x.
  - source: Total programs eventually pass the bound
    lean: StrongSettling.eventually_eligible
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: For any total program, its computable running time is eventually covered by the given dominant
      settling function.
  - source: Uniform effective list of majorants
    lean: StrongSettling.effective_majorants
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: One computable compiler produces programs on downward-closed domains whose values increase;
      its total members strictly majorize every total computable function.
  - source: Settling inequality (1)
    lean: StrongSettling.interval_domination
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: Initial and later response entries at the specified positions give the inequality throughout
      one interval.
  - source: Strong settling comparison across a tail
    lean: StrongSettling.row_comparison
    module: SolvedProblems.SettlingIntervals
    status: proved
    note: The marker intervals and response rules imply strong domination for all total computable
      outer and inner functions.
