version: v0.4
project:
  name: An atomic permutation class without a growth rate
  description: From the quantitative Pantone–Vatter grid-class inputs cited by the manuscript, construct
    a proper hereditary atomic permutation class whose level-size roots cross the two distinct thresholds
    17w/2 and 9w along arbitrarily late lengths, up to any positive error.
