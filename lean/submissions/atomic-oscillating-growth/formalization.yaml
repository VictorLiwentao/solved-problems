fidelity:
  divergences: A permutation is a zero-based one-line ordering of its length. Pattern containment
    is rank standardization of an actual subsequence. Levels enumerate distinct permutations. GridFacts
    assumes heredity, the stated 9w growth limit, infinitely recurrent membership for Q, and the explicit
    level sizes bound from Proposition 6.3 for each w≥4105. The proof constructs all stages after
    their predecessors, proves the direct-sum estimates and excludes the class of all permutations
    using factorial growth.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Count patterns in an infinite direct sum at a valley
    lean: AtomicGrowth.joint_valley
    module: SolvedProblems.AtomicGrowth
    status: proved
    note: If each later block contributes only allowed small patterns and their weighted level sums
      are at most one, the full class has at most 2^P L^m members at level m, where P counts the positions
      in the preceding blocks.
  - source: Proper atomic class from quantitative grid data
    lean: AtomicGrowth.oscillation_from_grid_data
    module: SolvedProblems.AtomicGrowth
    status: proved
    note: Given the cited grid-class inputs, there is a sequence of finite permutation stages whose
      pattern class is proper, hereditary and atomic, with arbitrarily late root counts below 17w/2+ε
      and above 9w−ε for every positive ε, and hence no growth limit.
