version: v0.4
project:
  name: Frucht's theorem and weak forms of anti-foundation
  description: From Frucht’s theorem for arbitrary groups, every accessible extensional pointed directed
    graph has the canonical weak representation CWFAFA₂. A direct construction of rigid graph embeddings
    and reusable labels discharges the supply premise of the [graph-expansion theorem](SolvedProblems/WeakFrucht.lean).
    The pointwise-action formulation uses only propext and Quot.sound.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
