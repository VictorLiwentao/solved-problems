    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: The group-isomorphism FT hypothesis quantifies over groups, with actual automorphism
    groups of simple graphs. The endpoint is the representation property on accessible extensional
    pointed digraphs. The proof uses integer shifts with two marked automorphisms, encodes a rigid
    uncolored graph, reuses uniform graph labels, and restores the well-founded part. The pointwise-action
    version makes classical propositional decisions explicit.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Principal new implication
    lean: WeakFrucht.frucht_implies_cwf
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: Bare Frucht for groups implies the canonical weak representation for these directed graphs.
  - source: Pointwise-action formulation
    lean: WeakFrucht.action_frucht_implies_cwf
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: The group-action version derives the same representation without Classical.choice.
  - source: Rigid embeddings from actions
    lean: WeakFrucht.embedding_of_actions
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: Every represented set embeds into one rigid graph under the action formulation of Frucht.
  - source: Reusable labels
    lean: WeakFrucht.labels_of_embedding
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: A rigid embedding supplies a coded family of distinct labels.
  - source: Graph-representation bridge
    lean: WeakFrucht.rigid_embeddings_imply_cwf
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: Rigid embeddings yield the weak representation.
  - source: Translation group calculation
    lean: WeakFrucht.Shift.centralizer
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: The joint centralizer of two designated automorphisms in the eventually translating group
      is trivial.
  - source: Rigid embeddings from Frucht
    lean: WeakFrucht.embedding_of_frucht
    module: SolvedProblems.WeakFruchtConjecture
    status: proved
    note: The usual group isomorphism formulation gives the rigid graph embeddings used by the proof.
