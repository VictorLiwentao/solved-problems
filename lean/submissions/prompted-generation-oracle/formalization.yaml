version: v0.4
project:
  name: The halting threshold for prompted language generation
  description: For a countable indexed family of infinite languages with uniformly decidable membership,
    eventual generation with an oracle, deterministic or almost surely randomized, is equivalent to
    a partial oracle-computable bound on fresh answer lengths.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
