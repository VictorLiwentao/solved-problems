  id: Li2026-prompted-generation-oracle
  location: https://github.com/VictorLiwentao/solved-problems/tree/ccd7c5af43e57e7758d49febfcf4bbdc26c1ffc6/results/learning-theory/prompted-generation-oracle
  relationship: formalizes
- title: Kleinberg and Mullainathan on language generation in the limit
  location: https://arxiv.org/abs/2404.06757v1
  relationship: background
  note: Jon Kleinberg and Sendhil Mullainathan (§7.2)
status:
  scope: The countable-family criterion in all three directions under the nontrivial-prompt promise,
    including the existence of a fair-coin tape law.
  sorry_count: 0
  sorry_in_definitions: 0
