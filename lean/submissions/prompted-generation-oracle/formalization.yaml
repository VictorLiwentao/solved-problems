  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Parallel agents used the pinned Lean and Mathlib toolchain.
    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: Words are finite lists over a finite alphabet. Samples use canonical lists for finite
    sets. Effective oracle computations are represented by finite stages. The randomized generator
    reads prefixes of one shared fair-coin tape, almost surely terminates on legal histories and eventually
    succeeds on every fixed exhaustive legal stream. The pair-degree and complexity-theoretic results
    in this paper are separate.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Theorem on a criterion for arbitrary countable families
    lean: PromptBound.lengthCriterion
    module: SolvedProblems.PromptBound
    status: proved
    note: The equivalence includes the sample-dependent length bound after a finite target witness,
      randomized generation, and constructive selection of a deterministic generator.
  - source: Fair-coin law for the random-generator model
    lean: PromptBound.fairLaw_exists
    module: SolvedProblems.PromptBound
    status: proved
    note: The law on infinite tapes has uniform distributions on all finite initial segments.
