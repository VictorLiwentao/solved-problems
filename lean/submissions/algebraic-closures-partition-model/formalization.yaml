status:
  scope: Finite support of polynomial coefficients identifies internal algebraic closedness with ordinary
    algebraic closedness. The proof covers all three conclusions, including internal well-orderability
    of algebraically closed fields, existence of an internal closure, and supported uniqueness over
    the original field.
