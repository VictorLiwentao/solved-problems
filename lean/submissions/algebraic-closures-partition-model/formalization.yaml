version: v0.4
project:
  name: Which fields have algebraic closures in the finite partition model?
  description: In Bruce’s finite partition model, an internal field has an internal algebraic closure
    exactly when its carrier is internally well-orderable. Two such closures have a supported isomorphism
    over the base field.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
