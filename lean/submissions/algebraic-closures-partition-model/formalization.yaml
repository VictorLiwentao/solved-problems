    prompting_notes: The repository owner requested five additional end-to-end proofs from the original
      67 drafts.
  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: The natural numbers represent the countably many atoms. A finite list of subsets defines
    the cells of a finite partition. The full partition stabilizer acts by field automorphisms and
    each element has finite support. Internal well-orders and maps are required to have supported
    relations and graphs. This is the external permutation-model presentation used in the draft. The
    final observation about other involution-generated permutation models is outside this statement.
