  notes: The draft records its own AI assistance. Spend and wall time were not tracked.
fidelity:
  divergences: A coloring of the atoms by natural numbers represents a countable partition. The action
    on sets is by image. Well-orders of members, of the family and of its union must each be preserved
    by a supported action. The external construction proves a common refinement works for every member
    without assuming regularity of the atom cardinal.
