fidelity:
  divergences: The natural numbers represent atoms. A finite coloring represents a partition, and
    its full stabilizer acts on an arbitrary carrier of hereditarily supported elements. The supports
    of both parts are proved in this external presentation. Ambient choice is used for external constructions.
review:
  status: self-assessed
  notes: The mathematical statements were checked against the cited text. Independent human review
    is pending.
alignment:
  statements:
  - source: Main theorem on every infinite set in Bruce’s model
    lean: AtomSplit.everyInfiniteSetSplits
    module: SolvedProblems.AtomSplit
    status: proved
    note: For every allowed stabilizer action on an infinite carrier, the proof obtains two complementary,
      infinite supported subsets.
