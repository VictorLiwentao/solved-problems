version: v0.4
project:
  name: Private generation in the limit on uncountable collections
  description: For the uncountable collection of nonempty unions of columns, an ordinary generator
    succeeds immediately. Pure privacy or a finite Rényi budget gives worst-case utility zero. Any
    positive additive privacy allowance permits probability-one eventual generation.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
