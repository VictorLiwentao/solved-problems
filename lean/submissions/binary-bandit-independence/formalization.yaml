version: v0.4
project:
  name: Binary bandit learnability and the continuum hypothesis
  description: Two explicit binary bandits have exact criteria. The open-target bandit on the Borel
    interval is learnable exactly when the continuum exceeds ℵ₁. The partial-label bandit on the interval
    times a bit is learnable exactly when the full powerset of the interval supports a countably additive
    probability vanishing on points.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
classification:
