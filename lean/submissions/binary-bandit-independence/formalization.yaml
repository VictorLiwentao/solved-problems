version: v0.4
project:
  name: Binary bandit learnability and the continuum hypothesis
  description: For the binary bandit on the Borel unit interval whose nonzero rewards are indicators
    of open sets with complement of cardinality at most ℵ₁, learnability is equivalent to the continuum
    exceeding ℵ₁. Under failure of CH, a uniform output attains optimal reward almost surely with
    zero queries.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
