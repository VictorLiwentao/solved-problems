version: v0.4
project:
  name: Finite Gaussian moments determine an entire ReLU function
  description: For a ReLU network with P parameters and a finite list of integrable tests, almost
    every matrix of 2P+1 measurements preserves equality of all moments in the list for all parameter
    pairs simultaneously. Each output coordinate is one integral against a fixed linear combination
    of the tests.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
