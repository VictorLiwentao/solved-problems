    is pending.
alignment:
  statements:
  - source: Generic linear compression
    lean: ReluMoments.compression
    module: SolvedProblems.ReluMoments
    status: proved
    note: Lebesgue-almost every matrix with more than twice the parameter dimension in rows is one-to-one
      on the given image.
  - source: Compression of network moment vectors
    lean: ReluMoments.network_compression
    module: SolvedProblems.ReluMoments
    status: proved
    note: Compressed measurements distinguish exactly the same network parameter pairs as the given
      finite moment vector.
  - source: Measurements by fixed integrals
    lean: ReluMoments.measurement_integral
    module: SolvedProblems.ReluMoments
    status: proved
    note: Each compressed coordinate integrates the network against a fixed linear combination of
      the input tests.
