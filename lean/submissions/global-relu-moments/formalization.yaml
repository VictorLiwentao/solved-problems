fidelity:
  divergences: The proof first establishes injectivity of almost every real linear map on the image
    of any locally Lipschitz P-parameter map into finite-dimensional space when the output dimension
    exceeds 2P. It applies this to actual network evaluations, strongly measurable tests and integrability
    of each test times 1+‖x‖.
