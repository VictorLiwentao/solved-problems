  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - OpenAI GPT-6 (Codex)
    framework: OpenAI Codex
    tool_setup: Pinned Lean 4 and Mathlib v4.35.0.
    prompting_notes: The repository owner requested high-impact formalizations with exact hypotheses,
      index entries and kernel verification.
fidelity:
  divergences: Binary coordinates are predicates or bits on a well-ordered index. The rigid relation
    is on the given carrier. The construction uses transfinite refinement and recovers the labelled
    children of split cells by directed-path substitution. The fully instantiated statements use Classical.propDecidable;
    the parameterized theorem is checked without Classical.choice.
review:
  status: self-assessed
  notes: The target statements were compared with the versioned manuscript. Independent human review
    is pending.
alignment:
  statements:
  - source: Construction for a well-ordered coordinate separator
    lean: OrdinalCube.ordinal_cube_rigid
    module: SolvedProblems.OrdinalCube
    status: proved
    note: An injective binary code gives the original carrier a rigid binary relation under explicit
      propositional decidability.
  - source: Problem 5
    lean: OrdinalCube.ordinal_subsets
    module: SolvedProblems.OrdinalCube
    status: proved
    note: Every subset of a well-ordered binary cube has a rigid binary relation.
  - source: Kinna–Wagner consequence
    lean: OrdinalCube.kwp_implies_rigid
    module: SolvedProblems.OrdinalCube
    status: proved
    note: The Kinna–Wagner embedding principle implies the rigid-relation principle.
