  location: https://github.com/VictorLiwentao/solved-problems/tree/2b368e7e8473e0543a376d30412fc9ed3783f7a9/results/set-theory/rigidity-ordinal-cubes
  relationship: formalizes
- title: Paul Howard and Eleftherios Tachtsis
  location: https://doi.org/10.4064/fm960-12-2015
  relationship: background
  note: Paul Howard and Eleftherios Tachtsis (§6, Problem 5, following Hamkins’s 2009 question)
status:
  scope: Howard and Tachtsis’s Problem 5 and the manuscript’s Kinna–Wagner consequence. There is no
    cardinality or nonemptiness assumption on the subset.
  sorry_count: 0
  sorry_in_definitions: 0
