version: v0.4
project:
  name: Rigid relations on subsets of ordinal Cantor cubes
  description: Every subset of a binary cube indexed by a well-order carries a rigid binary relation.
    The construction also works on any carrier injected into such a cube and gives the rigid-relation
    principle from the Kinna–Wagner principle.
  authors:
  - Wentao Li
  responsible_maintainers:
  - Wentao Li
  license: Apache-2.0
