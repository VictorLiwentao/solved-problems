status:
  scope: >-
    The 24 named declarations below cover selected results from 14 drafts.
    Each alignment identifies the part of the draft proved by its Lean declaration.
    The parking and runtime certificates, tape-language example and promise-template
    operation spectrum each cover only part of their respective drafts.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      models: ["OpenAI GPT-6 (Codex)"]
      framework: OpenAI Codex
      tool_setup: >-
        Codex agents wrote Lean statements and proof terms and tactics, compiled them
        with the repository's pinned Lean toolchain, and ran Lake Comparator.
      prompting_notes: >-
        The repository owner requested end-to-end proofs from the drafts, starting
        with easier results, parallel work on separate drafts, and Comparator checks.
  notes: >-
    The bibliographic credits for AI assistance in writing the mathematical drafts are
    recorded separately in each cited draft. The agents developed the Lean code here
    from those drafts. Wall time, spending and the individual agents' model variants
    were not recorded.

fidelity:
  divergences: >-
    The alignments give declaration-specific restrictions and changes of model.
    Word and edge types encode countable universes directly. Existential learners
    and generators carry no effectiveness guarantee unless this is proved separately.
    Finite thresholds are characterized one at a time, including the case where no
    finite threshold works. The source sections on randomized learners, general
    list sizes, Catalan evaluation, computability and set-theoretic compactness
    extend beyond the selected theorems.

review:
  status: self-assessed
  notes: >-
    The project checked the statements against its cited drafts and checked the
    proofs mechanically in Lean. Independent mathematical and priority review
    of the drafts is pending. No independent human reviewer is recorded.

alignment:
  statements:
    - source: "Li2026-parking-excedances, integer certificate at x = −1/5"
      lean: ParkingExcedances.signedCertificate
      module: SolvedProblems.ParkingExcedances
      status: partial
      note: >-
        The three printed integers A, B and C give the stated negative value of B² − AC. Relating
        them to the size-17 parking polynomial and using the Laguerre inequality to infer a nonreal
        zero remain open in Lean.
    - source: "Li2026-splitting-busy-beaver, Which machines carry the record?"
      lean: BusyBeaver.record_split
      module: SolvedProblems.RuntimeRecords
      status: partial
      note: >-
        For any finite table with natural-valued runtimes, its maximum equals the larger maximum of
        its two colour classes, with empty maximum zero. The theorem assumes an input table and
        colouring. The construction on halting machines, its growth and its oracle properties
        remain open in Lean.
    - source: "Li2026-oracle-free-sound-coverage, Theorem"
      lean: SoundCoverage.finiteWitnessCriterion
      module: SolvedProblems.SoundCoverage
      status: proved
      note: >-
        Eventual sound coverage on every full positive enumeration is equivalent to a
        finite-witness inclusion condition. Different indices may have the same target and
        different ambient sets. The proof applies to all nonempty targets, including finite ones.
    - source: "Li2026-last-guess-identification, A descending chain with singleton telltales, theorem main"
      lean: LastGuess.oneBitSeparation
      module: SolvedProblems.LastGuess
      status: proved
      note: >-
        For the marker-and-columns family, every deterministic last-guess learner fails approximate
        identification on some repetition-free text, even with a free first response. One extra bit
        permits exact identification on every full text. Randomization and the classification of
        other descending chains remain open in Lean.
    - source: "Li2026-last-guess-identification, A descending chain with singleton telltales, construction before theorem main"
      lean: LastGuess.singletonTelltale
      module: SolvedProblems.LastGuess
      status: proved
      note: >-
        For every target index n, one word excludes every strictly smaller target contained in that
        target. The word type directly represents the marker and the words in the disjoint columns.
    - source: "Li2026-robust-contrastive-closure, A closure dimension for corrupted pairs"
      lean: GenerationThreshold.uniformCriterion
      module: SolvedProblems.GenerationThreshold
      status: proved
      note: >-
        For budget k, a uniform distinct-edge threshold t works exactly when every simple
        obstruction has fewer than t edges. Obstructions have a nonempty version space. Repeated
        corrupt observations count separately in the performance guarantee.
    - source: "Li2026-robust-contrastive-closure, A closure dimension for corrupted pairs, edge deletion"
      lean: GenerationThreshold.deletionCriterion
      module: SolvedProblems.GenerationThreshold
      status: proved
      note: >-
        On a list of distinct edges, at most k violations is equivalent to being able to delete at
        most k edges and have all remaining edges cross the target cut.
    - source: "Li2026-robust-contrastive-closure, Nonuniform generation"
      lean: GenerationThreshold.nonuniformCriterion
      module: SolvedProblems.GenerationThreshold
      status: proved
      note: >-
        At fixed budget, one rule with a target-dependent threshold exists exactly for increasing
        countable unions of classes having uniform finite thresholds.
    - source: "Li2026-robust-contrastive-closure, An unknown-budget example"
      lean: GenerationThreshold.unknownBudget
      module: SolvedProblems.ThreeSupports
      status: partial
      note: >-
        One rule succeeds for each of three explicit supports whenever the violation count is
        strictly less than one third of the current prefix length. Impossibility at the boundary
        and the separate identification claim remain open in Lean.
    - source: "Li2026-uniform-list-generation, Words common to the remaining targets, theorem crit"
      lean: GenerationThreshold.listThresholdCriterion
      module: SolvedProblems.GenerationThreshold
      status: proved
      note: >-
        For each positive list length k, t is an admissible uniform threshold exactly when every
        finite intersection of a subfamily with no k-element transversal outside the intersection
        has size less than t. Quantifying over thresholds includes the cases of no obstruction and
        of unbounded obstruction sizes.
    - source: "Li2026-uniform-list-generation, A collection that defeats every finite partition, theorem sep"
      lean: TwoGuess.twoGuessSeparation
      module: SolvedProblems.TwoGuess
      status: partial
      note: >-
        On the countable block-word alphabet, lists of length at most two work after one
        observation. Every finite colouring has a colour with arbitrarily large exhausted
        intersections of two targets. The general list-size theorem, unary-regular implementation,
        and randomized corollary remain open in Lean.
    - source: "Li2026-prompted-generation-by-fibers, The question, theorem on fiber families"
      lean: PromptGeneration.fiberReduction
      module: SolvedProblems.PromptGeneration
      status: proved
      note: >-
        Prompted generation is equivalent to ordinary generation for each fixed label’s fiber
        family. The stream may repeat observations. Nonempty fibers suffice for this equivalence.
        The additional finite-witness characterization remains open in Lean.
    - source: "Li2026-prompted-generation-by-fibers, The question, countable-class consequence"
      lean: PromptGeneration.countablePrompts
      module: SolvedProblems.PromptGeneration
      status: proved
      note: >-
        For a sequence of hypotheses over an arbitrary label type with every fiber infinite, a
        prompted generator succeeds for every hypothesis. The convergence time may depend on the
        stream and requested label.
    - source: "Li2026-bouncer-tape-inclusion, An empty-wall counterexample"
      lean: TapeInclusion.emptyWallCounterexample
      module: SolvedProblems.TapeInclusion
      status: partial
      note: >-
        Two concrete binary half-tape expressions are aligned, have noncommuting primitive
        repeaters of length three, and have distinct first repeaters. Their languages satisfy
        strict inclusion for arbitrary repetition counts. The general inclusion criterion for
        separated repeaters remains open in Lean.
    - source: "Li2026-promise-compactness, theorem mass, cyclic and symmetric arities"
      lean: PromiseMass.cyclicSpectrum
      module: SolvedProblems.PromiseMass
      status: partial
      note: >-
        For the endpoint-preserving addition template a cyclic operation exists exactly when its
        arity divides the mass, and the same equivalence holds for symmetric operations. The list
        encoding also permits arity or mass zero. The ZF compactness equivalence, choice
        consequences and model construction remain open in Lean.
    - source: "Li2026-bounded-displacement-identification, The question and the presentation model, theorem and condition (1)"
      lean: Displacement.finiteWitnessCriterion
      module: SolvedProblems.Displacement
      status: proved
      note: >-
        A countable family admits identification on full repetition-free texts satisfying the
        eventual rank deadlines exactly when it has the stated finite witnesses at every starting
        round. Lean allows any nondecreasing integer deadline D(t) ≥ t, which includes the draft’s
        floor(Mt) for M ≥ 1.
    - source: "Li2026-contrastive-progress-and-corruption, Identification when progress outpaces corruption, support-valued formulation"
      lean: Progress.identificationCriterion
      module: SolvedProblems.Progress
      status: proved
      note: >-
        For a collection containing at least two distinct infinite proper supports, eventual
        recovery as a support-valued function is equivalent to finite pairwise disjoint holes.
        Honest coverage and divergence of distinct honest positives minus corrupt observations are
        the stream hypotheses. This version permits arbitrary collections.
    - source: "Li2026-contrastive-progress-and-corruption, Identification when progress outpaces corruption, countable class"
      lean: Progress.indexedCriterion
      module: SolvedProblems.Progress
      status: proved
      note: >-
        For countably indexed infinite proper supports with at least two distinct members, a
        learner can eventually return a correct support index exactly under the finite disjoint
        holes condition. Repeated indices naming the same support are allowed.
    - source: "Li2026-packing-catalan-lift, A lift that preserves every count, ordinal sum"
      lean: PackingLift.ordinalSum
      module: SolvedProblems.PackingLift
      status: proved
      note: >-
        For a seed with compatible disjoint boundary words and its minimum rank in the prefix, j ≥
        1 windows and t ≥ 1 new boundary letters, the lifted order consists of a chain of (j+1)t+jh
        fresh positions below the original packing order. The middle block may have length h = 0.
    - source: "Li2026-packing-catalan-lift, A lift that preserves every count, linear extensions"
      lean: PackingLift.preservesCounts
      module: SolvedProblems.PackingLift
      status: proved
      note: >-
        Inserting the fresh chain before the old ranks gives a bijection on rank permutations
        extending the window orders. Deriving the Catalan numbers for the specific 1324 seed
        remains open in Lean.
    - source: "Li2026-set-driven-contrastive-generation, Does the order of contrastive observations matter?"
      lean: SetDriven.setDrivenGeneration
      module: SolvedProblems.SetDriven
      status: proved
      note: >-
        For countably indexed infinite supports, existence of a generator for all honest covering
        presentations is equivalent to existence of one using only the set of observed edges.
        Presentations may repeat edges.
    - source: "Li2026-set-driven-contrastive-generation, An exact witness formulation"
      lean: SetDriven.witnessCriterion
      module: SolvedProblems.SetDriven
      status: proved
      note: >-
        For the same countable families, existence of a generator is equivalent to finite edge
        witnesses indexed by a target and a covering honest edge set. At every finite sample, all
        active targets admit a common fresh positive.
    - source: "Li2026-contrastive-generation-without-witnesses, The witness question, counterexample"
      lean: PositiveWitness.separation
      module: SolvedProblems.PositiveWitness
      status: proved
      note: >-
        The countable anchor-and-satellite family has unboundedly many positives and negatives for
        each target. It admits set-driven generation on all honest covering streams and defeats
        every compatible assignment of finite positive witnesses. Increasing finite squares exhaust
        the core.
    - source: "Li2026-packing-catalan-lift, A lift that preserves every count, identification of window positions"
      lean: PackingLift.samePosition
      module: SolvedProblems.PackingLayout
      status: proved
      note: >-
        Two slots of lifted windows have the same physical position exactly when they have the same
        identifier in the chain-and-old-positions model. This verifies the overlap identification
        used by the packing theorem.

acknowledgements: >-
  The question sources above credit the mathematicians whose problems motivated the
  drafts. The proof development uses Lean 4, its bundled standard library, Mathlib and
  Lake Comparator. The sound-coverage and prompted-generation models use Mathlib’s
  set of natural numbers to represent a language.
