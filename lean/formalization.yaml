version: "v0.4"

project:
  name: Language identification and generation, permutation packings, and selected finite certificates
  description: >-
    These proofs characterize when learners can identify or generate languages from positive
    examples, contrastive pairs, bounded-order texts, or prompted histories. They include
    separations for restricted learner memory and list-valued guesses. A permutation-pattern
    construction preserves packing counts by adjoining an initial chain to the packing order.
    Further declarations verify an empty-wall tape counterexample, the operation arities of
    an addition template, a signed integer certificate for a parking-function calculation,
    and a maximum identity for a finite runtime table.
  authors: [Wentao Li]
  responsible_maintainers: [Wentao Li]
  license: Apache-2.0

classification:
  arxiv: [cs.LG, math.CO]
  msc2020: [68Q32, 05A05, 68Q45, 08A40]

